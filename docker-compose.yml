# Local stack: PostgreSQL + API.  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: flashx
      POSTGRES_USER: flashx
      POSTGRES_PASSWORD: flashx
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashx"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://flashx:flashx@db:5432/flashx
      DJANGO_SETTINGS_MODULE: config.settings.development
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
